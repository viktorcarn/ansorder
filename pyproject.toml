[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "viktorcarn-ansorder"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对评测答案的顺序偏置相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "viktorcarn" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://viktorcarn.github.io"
Repository = "https://github.com/viktorcarn/ansorder"
Issues = "https://github.com/viktorcarn/ansorder/issues"

[project.scripts]
ansorder = "ansorder:main"

[tool.setuptools]
py-modules = ["ansorder"]
